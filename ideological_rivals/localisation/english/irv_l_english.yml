l_english:
 irv_rival_drive:0 "Ideological Rival"
 irv_rival_drive_desc:0 "This empire was born to oppose another's beliefs, and its people rally behind that purpose."
 irv_rival_redoubled:0 "Rival Ambition Awakened"
 irv_rival_redoubled_desc:0 "A rival ideology has begun to impose its will on the galaxy. This empire will not let it stand unanswered."
 irv_opinion_rival:0 "Ideological Rival"

 irv.2.name:0 "Voices Against Us"
 irv.2.desc:0 "Our listening posts pick up faint signals from far across the galaxy: the transmissions of civilisations whose every value seems the inverse of ours. We do not know them yet, but we already know this: wherever our ideals spread, theirs will push back.\n\n§HIdeological Rivals:§! a number of distant empires hold ethics opposed to ours, and they will seek to impose their will on the galaxy (the §YForce of Will§! ambition)."
 irv.2.a:0 "Let them come."

 irv.21.name:0 "The Rivals Stir"
 irv.21.desc:0 "Our declaration has not gone unheard. Across the galaxy, the empires that oppose our ideals redouble their efforts. Their ambition will advance faster from now on."
 irv.21.a:0 "Then we must be faster still."

 irv.22.name:0 "A Rival Will Awakens"
 irv.22.desc:0 "[From.GetName] has declared its intention to impose its ideology on the galaxy. Its beliefs are the opposite of ours, and it will not rest until they are everyone's."
 irv.22.a:0 "We will stand against them."
